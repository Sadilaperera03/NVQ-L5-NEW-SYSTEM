<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>ICT NVQ Level 05 | Learning Hub</title>
<style>body{margin:0;background:#FFF7FC;color:#92003A;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center}html[data-theme="dark"] body{background:#170D16;color:#FFADEE}</style>
<script src="theme.js"></script><link href="friendly.css" rel="stylesheet"/><link rel="stylesheet" href="aqua-theme.css?v=20261016"/><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="custom-theme.css?v=2"><script defer src="custom-theme.js?v=2"></script></head>
<body><button aria-label="Switch to dark mode" aria-pressed="false" class="theme-toggle" data-theme-toggle="" style="position:fixed;right:22px;top:18px;z-index:5;background:#92003A;color:white;" type="button"><span aria-hidden="true" class="theme-toggle-icon">☾</span><span class="theme-toggle-label">Dark mode</span></button><main><h1><img class="editz-splash-logo" src="editz-logo.png" alt="editz🍀"> LEARNINGHUB</h1><p id="loading">Checking your sign-in…</p></main>
<script type="module">
import {auth,ready,isAdmin} from './firebase-auth.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
if (!ready || !auth) {
  document.getElementById('loading').textContent='Firebase configuration is missing. Please configure firebase-config.js.';
} else {
  onAuthStateChanged(auth,user=>{
    location.replace(!user?'login.html':isAdmin(user)?'admin.html':'home.html');
  },err=>{document.getElementById('loading').textContent='Could not check login. Please refresh or check your internet connection.';console.error(err);});
}
</script>
<script defer="True" src="friendly.js"></script></body></html>
